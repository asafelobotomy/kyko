[package]
name = "kykod"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
kyko-core.workspace = true
kyko-proto = { path = "../../crates/kyko-proto" }
nix = { version = "0.31", default-features = false, features = ["term", "process", "signal", "fs"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "termios", "process", "event", "net"] }
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }

[dev-dependencies]
tempfile = "3.27.0"
