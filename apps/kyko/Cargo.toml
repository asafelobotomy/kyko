[package]
name = "kyko"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
clap.workspace = true
zbus = "6"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
kyko-core.workspace = true
kyko-link = { path = "../../crates/kyko-link" }
kyko-proto = { path = "../../crates/kyko-proto" }
kyko-term = { path = "../../crates/kyko-term" }

[build-dependencies]
cxx-qt-build = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
