# cargo-deny policy, checked in CI with `cargo deny check advisories licenses`.

[advisories]
# Known vulnerabilities always fail the check. Unmaintained crates fail too, for direct and
# transitive dependencies alike.
unmaintained = "all"
yanked = "deny"

[licenses]
# Permissive licences compatible with kyko's MIT licence. Anything else is denied.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
