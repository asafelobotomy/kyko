name: CI

on:
  # Branches only, so the v* tags the release creates do not run it. release.yml also calls it
  # (workflow_call) on a push to main that releases, so that the release waits for its own CI.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # --init: a job container's PID 1 is otherwise a process that never reaps orphans. kykod's tests
    # end shells whose children are re-parented to PID 1, and every orphan that ends would stay a
    # zombie for the rest of the job.
    container:
      image: archlinux:latest
      options: --init
    steps:
      # base-devel is for makepkg, which also builds the package below. less is for the end-to-end
      # tests (the PKGBUILD lists it in checkdepends).
      - name: Install toolchain, makepkg and cargo-deny
        run: pacman -Syu --noconfirm --needed rust git base-devel cargo-deny less zsh fish python imagemagick qt6-base qt6-declarative qt6-shadertools xorg-server-xvfb xdotool xclip mesa ttf-dejavu qt6-wayland layer-shell-qt sway grim dbus appstream desktop-file-utils
      # fetch-depth 0 for tests/shell/release_needed_test.sh, which ends with a read-only run of
      # scripts/release-needed.sh on this repository: with full history and tags it sees what the
      # release's `decide` job sees (a shallow clone has no tags). The version comes from the PKGBUILD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # makepkg refuses to run as root (and version_test.sh skips its .SRCINFO check as root), so
      # everything but pacman -U runs as this user.
      - name: Create an unprivileged user
        run: useradd -m tester && chown -R tester:tester "$GITHUB_WORKSPACE"
      - name: Vendored uQ kits match their pinned checksums
        run: scripts/check-uq-native.sh
      - name: Every source file is within 400 lines of code (uQ's uq-loc)
        run: scripts/check-loc.sh
      - name: Format, lint and test
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked"
      - name: Audit dependencies
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            cargo deny check advisories licenses"
      - name: Shell tests
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            for t in tests/shell/*.sh; do echo \"== \$t\"; bash \"\$t\"; done"
      # The package's check() runs the workspace tests again: intended, the run above gives a fast,
      # readable failure and this one proves the packaged source tree builds and tests on its own.
      - name: Build the package
        run: |
          su tester -c "set -e
            cd '$GITHUB_WORKSPACE'
            scripts/build-local-pkg.sh"
      - name: Install the package and run both binaries
        run: |
          pacman -U --noconfirm target/pkg/kyko-*.pkg.tar.zst
          kyko --version
          kykod --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kyko-pkg
          path: target/pkg/*.pkg.tar.zst
          if-no-files-found: error

  hyprland:
    # The hotkey on a real Hyprland (scripts/hotkey-live.sh): Lua binds through `eval`, uQ's F12
    # left to uQ, a key press that runs the command, and a reload. vkms gives Hyprland the DRM card
    # it needs even headless.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load vkms
        run: |
          sudo modprobe vkms 2>/dev/null || {
            sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)" && sudo modprobe vkms
          }
          card=""
          for c in /sys/class/drm/card*; do
            case "${c##*/}" in *-*) continue ;; esac
            [ "$(basename "$(readlink -f "$c/device")")" = vkms ] && card=/dev/dri/${c##*/}
          done
          [ -n "$card" ] || { echo "::error::vkms loaded but no vkms card found"; exit 1; }
          echo "SMOKE_CARD=$card" >> "$GITHUB_ENV"
      - name: Hotkey on Hyprland
        run: |
          docker run --rm --device "$SMOKE_CARD" -e SMOKE_CARD -e SMOKE_UID="$(id -u)" \
            -v "$GITHUB_WORKSPACE:/src" archlinux:latest bash /src/scripts/hotkey-live.sh
