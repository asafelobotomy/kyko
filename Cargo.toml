[workspace]
resolver = "3"
members = ["crates/kyko-core", "crates/kyko-proto", "apps/kykod", "apps/kyko"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "MIT"
repository = "https://github.com/asafelobotomy/kyko"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
kyko-core = { path = "crates/kyko-core" }
